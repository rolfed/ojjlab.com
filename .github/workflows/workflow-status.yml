name: Workflow Status Dashboard

on:
  workflow_run:
    workflows:
      - 'PR Validation (Optimized)'
      - 'Deploy to GitHub Pages'
      - 'Release and Version Management'
      - 'Unit Tests'
      - 'Fast Integration Tests'
    types:
      - completed

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  update-status:
    name: Update Workflow Status
    runs-on: ubuntu-latest
    steps:
      - name: Get workflow information
        id: workflow-info
        uses: actions/github-script@v7
        with:
          script: |
            const workflow = context.payload.workflow_run;
            const conclusion = workflow.conclusion;
            const name = workflow.name;
            const runId = workflow.id;
            const sha = workflow.head_sha;
            const branch = workflow.head_branch;
            const actor = workflow.actor.login;
            const url = workflow.html_url;

            console.log(`Workflow: ${name}`);
            console.log(`Conclusion: ${conclusion}`);
            console.log(`Branch: ${branch}`);
            console.log(`Actor: ${actor}`);

            core.setOutput('workflow-name', name);
            core.setOutput('conclusion', conclusion);
            core.setOutput('run-id', runId);
            core.setOutput('sha', sha);
            core.setOutput('branch', branch);
            core.setOutput('actor', actor);
            core.setOutput('url', url);

      - name: Create status summary
        id: status-summary
        run: |
          WORKFLOW="${{ steps.workflow-info.outputs.workflow-name }}"
          CONCLUSION="${{ steps.workflow-info.outputs.conclusion }}"
          BRANCH="${{ steps.workflow-info.outputs.branch }}"
          ACTOR="${{ steps.workflow-info.outputs.actor }}"
          URL="${{ steps.workflow-info.outputs.url }}"

          case $CONCLUSION in
            "success") EMOJI="✅"; STATUS="Success" ;;
            "failure") EMOJI="❌"; STATUS="Failed" ;;
            "cancelled") EMOJI="🚫"; STATUS="Cancelled" ;;
            "timed_out") EMOJI="⏰"; STATUS="Timed Out" ;;
            "skipped") EMOJI="⏭️"; STATUS="Skipped" ;;
            *) EMOJI="❓"; STATUS="Unknown" ;;
          esac

          echo "SUMMARY<<EOF" >> $GITHUB_OUTPUT
          echo "## $EMOJI Workflow Status Update" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "**Workflow:** $WORKFLOW" >> $GITHUB_OUTPUT
          echo "**Status:** $EMOJI $STATUS" >> $GITHUB_OUTPUT
          echo "**Branch:** \`$BRANCH\`" >> $GITHUB_OUTPUT
          echo "**Triggered by:** @$ACTOR" >> $GITHUB_OUTPUT
          echo "**Run Details:** [View Workflow]($URL)" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT

          if [[ "$CONCLUSION" == "failure" ]]; then
            echo "### 🔍 Troubleshooting" >> $GITHUB_OUTPUT
            echo "1. Check the workflow logs for detailed error information" >> $GITHUB_OUTPUT
            echo "2. Review recent changes that might have caused the failure" >> $GITHUB_OUTPUT
            echo "3. Ensure all dependencies are up to date" >> $GITHUB_OUTPUT
            echo "4. Run tests locally to reproduce the issue" >> $GITHUB_OUTPUT
          elif [[ "$CONCLUSION" == "success" ]]; then
            echo "### 🎉 All checks passed!" >> $GITHUB_OUTPUT
            echo "The workflow completed successfully. Great work! 🚀" >> $GITHUB_OUTPUT
          fi

          echo "" >> $GITHUB_OUTPUT
          echo "---" >> $GITHUB_OUTPUT
          echo "*🤖 Automated status update*" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Find related PR
        id: find-pr
        if: steps.workflow-info.outputs.branch != 'main'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = '${{ steps.workflow-info.outputs.branch }}';

            try {
              const { data: prs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${branch}`,
                state: 'open'
              });

              if (prs.length > 0) {
                const pr = prs[0];
                console.log(`Found PR #${pr.number}: ${pr.title}`);
                core.setOutput('pr-number', pr.number);
                core.setOutput('pr-found', 'true');
              } else {
                console.log('No related PR found');
                core.setOutput('pr-found', 'false');
              }
            } catch (error) {
              console.error('Error finding PR:', error.message);
              core.setOutput('pr-found', 'false');
            }

      - name: Comment on related PR
        if: steps.find-pr.outputs.pr-found == 'true' && steps.workflow-info.outputs.conclusion == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const summary = `${{ steps.status-summary.outputs.SUMMARY }}`;
            const prNumber = '${{ steps.find-pr.outputs.pr-number }}';

            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(prNumber),
                body: summary
              });
              console.log(`✅ Posted status update to PR #${prNumber}`);
            } catch (error) {
              console.error('❌ Failed to post PR comment:', error.message);
            }
