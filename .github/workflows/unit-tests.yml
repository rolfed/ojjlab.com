name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Optimize for speed by limiting concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Fast fail for hanging tests

    strategy:
      matrix:
        node-version: [18.x] # Single Node version for speed

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Fast npm install with cache optimization
      - name: Install dependencies
        run: |
          npm ci --prefer-offline --no-audit --no-fund

      # Run Jest with optimized CI settings
      - name: Run unit tests with coverage
        run: npm run test:unit:ci
        env:
          CI: true
          NODE_ENV: test

      # Upload coverage reports for analysis
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            coverage/
            coverage/lcov.info
            coverage/coverage-summary.json
          retention-days: 7

      # Generate coverage summary for PR comment
      - name: Generate coverage summary
        if: github.event_name == 'pull_request'
        id: coverage
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "COVERAGE_SUMMARY<<EOF" >> $GITHUB_OUTPUT
            node -e "
              const fs = require('fs');
              const coverage = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
              const total = coverage.total;

              const formatPercent = (val) => val ? val.pct + '%' : '0%';

              console.log('## 📊 Unit Test Coverage Report');
              console.log('');
              console.log('| Metric | Coverage |');
              console.log('|--------|----------|');
              console.log('| **Statements** | ' + formatPercent(total.statements) + ' |');
              console.log('| **Branches** | ' + formatPercent(total.branches) + ' |');
              console.log('| **Functions** | ' + formatPercent(total.functions) + ' |');
              console.log('| **Lines** | ' + formatPercent(total.lines) + ' |');
              console.log('');

              const threshold = 10; // Match jest.config.js threshold
              const passing = [
                total.statements?.pct >= threshold,
                total.branches?.pct >= threshold,
                total.functions?.pct >= threshold,
                total.lines?.pct >= threshold
              ].every(Boolean);

              if (passing) {
                console.log('✅ **All coverage thresholds met!**');
              } else {
                console.log('❌ **Coverage thresholds not met.** Minimum required: ' + threshold + '%');
              }

              console.log('');
              console.log('_Generated by Jest unit tests in GitHub Actions_');
            "
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "COVERAGE_SUMMARY=❌ Coverage report not generated" >> $GITHUB_OUTPUT
          fi

      # Comment on PR with coverage results
      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = `${{ steps.coverage.outputs.COVERAGE_SUMMARY }}`;

            // Find existing coverage comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.data.find(
              comment => comment.user.login === 'github-actions[bot]' &&
                        comment.body.includes('📊 Unit Test Coverage Report')
            );

            const commentBody = coverage;

            if (existingComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }

      # Fail the job if coverage thresholds are not met
      - name: Check coverage thresholds
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const fs = require('fs');
              const coverage = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
              const total = coverage.total;
              const threshold = 10;

              const metrics = ['statements', 'branches', 'functions', 'lines'];
              let failed = false;

              metrics.forEach(metric => {
                const pct = total[metric]?.pct || 0;
                if (pct < threshold) {
                  console.log(\`❌ \${metric}: \${pct}% (required: \${threshold}%)\`);
                  failed = true;
                } else {
                  console.log(\`✅ \${metric}: \${pct}% (required: \${threshold}%)\`);
                }
              });

              if (failed) {
                console.log('\\n❌ Coverage thresholds not met!');
                process.exit(1);
              } else {
                console.log('\\n✅ All coverage thresholds met!');
              }
            "
          else
            echo "❌ Coverage report not found"
            exit 1
          fi
