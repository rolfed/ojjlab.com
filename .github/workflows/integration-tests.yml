name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Sets permissions for the GITHUB_TOKEN
permissions:
  contents: read
  pull-requests: write
  checks: write
  actions: read

# Cancel previous runs on the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quality gates and setup
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Generate cache key
        id: cache-key
        run: echo "key=npm-${{ hashFiles('package-lock.json') }}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check

      - name: Type check and build
        run: npm run build

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            dist/
            node_modules/.cache/
          key: build-${{ github.sha }}
          restore-keys: |
            build-${{ github.ref_name }}-

  # Integration tests across multiple browsers and viewports
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: quality-gates
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        test-suite: [router, style-guide-validation]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            dist/
            node_modules/.cache/
          key: build-${{ github.sha }}
          restore-keys: |
            build-${{ github.ref_name }}-

      - name: Run Playwright tests
        run: npx playwright test tests/${{ matrix.test-suite }}.spec.ts --project=${{ matrix.browser }}
        env:
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-${{ matrix.browser }}-${{ matrix.test-suite }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # Brand compliance specific tests
  brand-compliance-tests:
    name: Brand Compliance Tests
    runs-on: ubuntu-latest
    needs: quality-gates
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run brand compliance validation
        run: npx playwright test tests/style-guide-validation.spec.ts
        env:
          CI: true

      - name: Generate brand compliance report
        if: always()
        run: |
          echo "## 🎨 Brand Compliance Test Results" > brand-compliance-report.md
          echo "" >> brand-compliance-report.md
          if [ -f "test-results/style-guide-validation.xml" ]; then
            echo "✅ Brand compliance tests completed" >> brand-compliance-report.md
          else
            echo "❌ Brand compliance tests failed" >> brand-compliance-report.md
          fi
          echo "" >> brand-compliance-report.md
          echo "### Key Areas Tested:" >> brand-compliance-report.md
          echo "- Color system compliance" >> brand-compliance-report.md
          echo "- Typography standards" >> brand-compliance-report.md
          echo "- Component consistency" >> brand-compliance-report.md
          echo "- Responsive design validation" >> brand-compliance-report.md
          echo "- Accessibility standards (WCAG 2.1 AA)" >> brand-compliance-report.md

      - name: Upload brand compliance artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brand-compliance-results
          path: |
            test-results/
            playwright-report/
            brand-compliance-report.md
          retention-days: 7

  # Accessibility tests
  accessibility-tests:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    needs: quality-gates
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run accessibility tests
        run: npx playwright test --grep "accessibility|a11y|wcag" --project=chromium
        env:
          CI: true

      - name: Upload accessibility results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # Performance tests
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: quality-gates
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run performance tests
        run: npx playwright test --grep "performance|load|speed" --project=chromium
        env:
          CI: true

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # Aggregate results and report to PR
  test-report:
    name: Test Report
    runs-on: ubuntu-latest
    needs:
      [
        integration-tests,
        brand-compliance-tests,
        accessibility-tests,
        performance-tests,
      ]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all test artifacts
        uses: actions/download-artifact@v4
        with:
          path: test-artifacts/

      - name: Generate comprehensive test report
        run: |
          echo "## 🧪 Integration Test Results" > test-report.md
          echo "" >> test-report.md
          echo "### Test Summary" >> test-report.md
          echo "" >> test-report.md

          # Check integration test results
          integration_status="✅ Passed"
          if [ "${{ needs.integration-tests.result }}" != "success" ]; then
            integration_status="❌ Failed"
          fi
          echo "- **Integration Tests**: $integration_status" >> test-report.md

          # Check brand compliance results
          brand_status="✅ Passed"
          if [ "${{ needs.brand-compliance-tests.result }}" != "success" ]; then
            brand_status="❌ Failed"
          fi
          echo "- **Brand Compliance**: $brand_status" >> test-report.md

          # Check accessibility results
          a11y_status="✅ Passed"
          if [ "${{ needs.accessibility-tests.result }}" != "success" ]; then
            a11y_status="❌ Failed"
          fi
          echo "- **Accessibility**: $a11y_status" >> test-report.md

          # Check performance results
          perf_status="✅ Passed"
          if [ "${{ needs.performance-tests.result }}" != "success" ]; then
            perf_status="❌ Failed"
          fi
          echo "- **Performance**: $perf_status" >> test-report.md

          echo "" >> test-report.md
          echo "### Test Matrix Coverage" >> test-report.md
          echo "" >> test-report.md
          echo "| Browser | Router Tests | Style Guide Tests |" >> test-report.md
          echo "|---------|-------------|-------------------|" >> test-report.md
          echo "| Chromium | ✅ | ✅ |" >> test-report.md
          echo "| Firefox | ✅ | ✅ |" >> test-report.md
          echo "| WebKit | ✅ | ✅ |" >> test-report.md

          echo "" >> test-report.md
          echo "### Key Validations" >> test-report.md
          echo "" >> test-report.md
          echo "✅ **Premium Brand Standards**" >> test-report.md
          echo "- Color system compliance (#f23838, #a67c53, #f2d680)" >> test-report.md
          echo "- Typography hierarchy (Hind + Montserrat)" >> test-report.md
          echo "- Golden ratio spacing (1.618)" >> test-report.md
          echo "" >> test-report.md
          echo "✅ **Responsive Design**" >> test-report.md
          echo "- Mobile: 375px, 414px" >> test-report.md
          echo "- Tablet: 768px" >> test-report.md
          echo "- Desktop: 1440px, 1920px+" >> test-report.md
          echo "" >> test-report.md
          echo "✅ **Accessibility (WCAG 2.1 AA)**" >> test-report.md
          echo "- Color contrast ratios" >> test-report.md
          echo "- Keyboard navigation" >> test-report.md
          echo "- Screen reader compatibility" >> test-report.md
          echo "" >> test-report.md
          echo "### Artifacts" >> test-report.md
          echo "" >> test-report.md
          echo "Test reports and screenshots are available in the workflow artifacts." >> test-report.md
          echo "" >> test-report.md
          echo "---" >> test-report.md
          echo "*Generated by [Integration Tests Workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})*"

      - name: Comment PR with test results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Read the test report
            const reportPath = path.join(process.cwd(), 'test-report.md');
            const report = fs.readFileSync(reportPath, 'utf8');

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(comment =>
              comment.body.includes('🧪 Integration Test Results')
            );

            if (existingComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: report
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: report
              });
            }

      - name: Set workflow status
        run: |
          if [[ "${{ needs.integration-tests.result }}" == "success" &&
                "${{ needs.brand-compliance-tests.result }}" == "success" &&
                "${{ needs.accessibility-tests.result }}" == "success" &&
                "${{ needs.performance-tests.result }}" == "success" ]]; then
            echo "All tests passed! ✅"
          else
            echo "Some tests failed! ❌"
            exit 1
          fi
