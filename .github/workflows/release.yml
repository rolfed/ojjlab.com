name: Release and Version Management

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

# Sets permissions for GITHUB_TOKEN
permissions:
  contents: write
  pull-requests: read

jobs:
  # Determine if release is needed
  check-release:
    name: Check if Release Needed
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      release_type: ${{ steps.check.outputs.release_type }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch full history for commit analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check if release is needed
        id: check
        run: |
          # Manual trigger always releases
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "release_type=${{ github.event.inputs.release_type }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check for conventional commits since last release
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LAST_TAG" ]; then
            # No previous tags, create initial release
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "release_type=minor" >> $GITHUB_OUTPUT
          else
            # Check commits since last tag
            COMMITS=$(git log --oneline --no-merges $LAST_TAG..HEAD)

            if echo "$COMMITS" | grep -qE "^[a-f0-9]+ (feat|fix|perf|refactor)"; then
              # Determine release type based on conventional commits
              if echo "$COMMITS" | grep -q "BREAKING CHANGE\|!:"; then
                echo "should_release=true" >> $GITHUB_OUTPUT
                echo "release_type=major" >> $GITHUB_OUTPUT
              elif echo "$COMMITS" | grep -q "^[a-f0-9]+ feat"; then
                echo "should_release=true" >> $GITHUB_OUTPUT
                echo "release_type=minor" >> $GITHUB_OUTPUT
              else
                echo "should_release=true" >> $GITHUB_OUTPUT
                echo "release_type=patch" >> $GITHUB_OUTPUT
              fi
            else
              echo "should_release=false" >> $GITHUB_OUTPUT
              echo "release_type=none" >> $GITHUB_OUTPUT
            fi
          fi

  # Create release
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      release_url: ${{ steps.create_release.outputs.html_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: version
        run: |
          RELEASE_TYPE="${{ needs.check-release.outputs.release_type }}"
          NEW_VERSION=$(npm version $RELEASE_TYPE --no-git-tag-version)
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Generate Changelog
        id: changelog
        run: |
          # Get the last tag
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")

          # Generate changelog from conventional commits
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --oneline --no-merges --pretty=format:"- %s" HEAD)
          else
            COMMITS=$(git log --oneline --no-merges --pretty=format:"- %s" $LAST_TAG..HEAD)
          fi

          # Categorize commits
          FEATURES=""
          FIXES=""
          OTHERS=""

          while IFS= read -r commit; do
            if [[ $commit =~ feat ]]; then
              FEATURES="$FEATURES\n$commit"
            elif [[ $commit =~ fix ]]; then
              FIXES="$FIXES\n$commit"
            else
              OTHERS="$OTHERS\n$commit"
            fi
          done <<< "$COMMITS"

          # Build changelog
          CHANGELOG="## What's Changed\n\n"

          if [ ! -z "$FEATURES" ]; then
            CHANGELOG="${CHANGELOG}### 🚀 Features\n$FEATURES\n\n"
          fi

          if [ ! -z "$FIXES" ]; then
            CHANGELOG="${CHANGELOG}### 🐛 Bug Fixes\n$FIXES\n\n"
          fi

          if [ ! -z "$OTHERS" ]; then
            CHANGELOG="${CHANGELOG}### 🔧 Other Changes\n$OTHERS\n\n"
          fi

          CHANGELOG="${CHANGELOG}**Full Changelog**: https://github.com/${{ github.repository }}/compare/${LAST_TAG}...${{ steps.version.outputs.new_version }}"

          # Save to file for GitHub release
          echo -e "$CHANGELOG" > CHANGELOG.md

          # Output for step
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo -e "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Commit version bump
        run: |
          git add package.json package-lock.json
          git commit -m "chore: Bump version to ${{ steps.version.outputs.new_version }}" --no-verify
          git push origin main

      - name: Create Git tag
        run: |
          git tag ${{ steps.version.outputs.new_version }}
          git push origin ${{ steps.version.outputs.new_version }}

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.new_version }}
          name: Release ${{ steps.version.outputs.new_version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          generate_release_notes: true

  # Post-release notification
  post-release:
    name: Post-Release Actions
    runs-on: ubuntu-latest
    needs: [check-release, create-release]
    if: needs.check-release.outputs.should_release == 'true'
    steps:
      - name: Release Summary
        run: |
          echo "🎉 Release ${{ needs.create-release.outputs.new_version }} created successfully!"
          echo "📦 Release Type: ${{ needs.check-release.outputs.release_type }}"
          echo "🔗 Release URL: ${{ needs.create-release.outputs.release_url }}"
          echo "🚀 The new version will be visible on the website after deployment completes."
