name: Dependabot Auto-Merge

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Check if PR is eligible for auto-merge
        id: check-eligibility
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            // Only auto-merge patch and minor updates for non-critical dependencies
            const title = pr.title.toLowerCase();
            const isPatch = title.includes('bump') && (title.includes('patch') || title.match(/from \d+\.\d+\.\d+ to \d+\.\d+\.\d+/));
            const isMinorNonCritical = title.includes('bump') && title.includes('minor') &&
              !title.includes('webpack') && !title.includes('vite') && !title.includes('typescript');

            const isEligible = isPatch || isMinorNonCritical;

            console.log(`PR Title: ${pr.title}`);
            console.log(`Is Patch: ${isPatch}`);
            console.log(`Is Minor Non-Critical: ${isMinorNonCritical}`);
            console.log(`Is Eligible: ${isEligible}`);

            core.setOutput('eligible', isEligible);

      - name: Wait for checks to complete
        if: steps.check-eligibility.outputs.eligible == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const maxWaitTime = 10 * 60 * 1000; // 10 minutes
            const checkInterval = 30 * 1000; // 30 seconds
            const startTime = Date.now();

            while (Date.now() - startTime < maxWaitTime) {
              const { data: checks } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.payload.pull_request.head.sha
              });

              const allCompleted = checks.check_runs.every(check =>
                check.status === 'completed'
              );

              const allSuccessful = checks.check_runs.every(check =>
                check.conclusion === 'success' || check.conclusion === 'neutral'
              );

              if (allCompleted) {
                if (allSuccessful) {
                  console.log('✅ All checks passed');
                  core.setOutput('checks-passed', 'true');
                  return;
                } else {
                  console.log('❌ Some checks failed');
                  core.setOutput('checks-passed', 'false');
                  return;
                }
              }

              console.log('⏳ Waiting for checks to complete...');
              await new Promise(resolve => setTimeout(resolve, checkInterval));
            }

            console.log('⏰ Timeout waiting for checks');
            core.setOutput('checks-passed', 'false');

      - name: Enable auto-merge
        if: steps.check-eligibility.outputs.eligible == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                event: 'APPROVE',
                body: '🤖 Auto-approved by Dependabot auto-merge workflow'
              });

              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                merge_method: 'squash',
                commit_title: `🔧 ${context.payload.pull_request.title}`,
                commit_message: `${context.payload.pull_request.body}\n\n🤖 Auto-merged by Dependabot workflow`
              });

              console.log('✅ PR auto-merged successfully');

            } catch (error) {
              console.error('❌ Auto-merge failed:', error.message);

              // Comment on PR about the failure
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `🤖 **Auto-merge failed**\n\nReason: ${error.message}\n\nPlease review and merge manually.`
              });
            }
