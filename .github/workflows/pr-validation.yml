name: PR Validation (Optimized)

on:
  pull_request:
    branches: [main]

# Comprehensive permissions for all operations
permissions:
  contents: read
  checks: write
  pull-requests: write
  issues: write
  actions: read

# Allow only one concurrent run per PR
concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Global environment variables for consistency
env:
  NODE_VERSION: '20'
  CACHE_VERSION: 'v2'

jobs:
  # Shared setup job for dependency caching
  setup:
    name: Setup & Cache
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-keys.outputs.deps }}
      build-cache-key: ${{ steps.cache-keys.outputs.build }}
      node-cache-hit: ${{ steps.deps-cache.outputs.cache-hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate cache keys
        id: cache-keys
        run: |
          echo "deps=${{ env.CACHE_VERSION }}-deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}" >> $GITHUB_OUTPUT
          echo "build=${{ env.CACHE_VERSION }}-build-${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ steps.cache-keys.outputs.deps }}
          restore-keys: |
            ${{ env.CACHE_VERSION }}-deps-${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

  # Parallel quality checks
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Run parallel quality checks
        run: |
          # Run linting and formatting checks in parallel
          npm run lint &
          npm run format:check &
          wait

  # Unit tests with enhanced coverage reporting
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Run unit tests with coverage
        run: npm run test:unit:ci

      - name: Generate coverage summary for PR
        id: coverage
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "COVERAGE_SUMMARY<<EOF" >> $GITHUB_OUTPUT
            node -e "
              const fs = require('fs');
              const coverage = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
              const total = coverage.total;
              const formatPercent = (val) => val ? val.pct + '%' : '0%';

              console.log('## 📊 Unit Test Coverage');
              console.log('| Metric | Coverage | Status |');
              console.log('|--------|----------|---------|');
              console.log('| Statements | ' + formatPercent(total.statements) + ' | ' + (total.statements?.pct >= 90 ? '✅' : '⚠️') + ' |');
              console.log('| Branches | ' + formatPercent(total.branches) + ' | ' + (total.branches?.pct >= 80 ? '✅' : '⚠️') + ' |');
              console.log('| Functions | ' + formatPercent(total.functions) + ' | ' + (total.functions?.pct >= 90 ? '✅' : '⚠️') + ' |');
              console.log('| Lines | ' + formatPercent(total.lines) + ' | ' + (total.lines?.pct >= 90 ? '✅' : '⚠️') + ' |');
            "
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "COVERAGE_SUMMARY=❌ Coverage report not generated" >> $GITHUB_OUTPUT
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: unit-tests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Optimized build with caching
  build:
    name: Build & Cache
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Build application
        run: npm run build

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            dist/
            node_modules/.vite/
          key: ${{ needs.setup.outputs.build-cache-key }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ github.sha }}
          path: dist/
          retention-days: 7

  # Smart integration tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest-4-cores
    needs: [setup, build]
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ matrix.browser }}-

      - name: Install Playwright browser
        run: npx playwright install ${{ matrix.browser }} --with-deps

      - name: Restore build artifacts
        uses: actions/cache@v4
        with:
          path: |
            dist/
            node_modules/.vite/
          key: ${{ needs.setup.outputs.build-cache-key }}
          fail-on-cache-miss: true

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-${{ matrix.browser }}-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # Enhanced security audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Run security audit
        run: |
          # Run audit with detailed output
          npm audit --audit-level moderate --json > audit-results.json || true

          # Generate human-readable summary
          echo "## 🔒 Security Audit Results" > security-summary.md
          if [ -s audit-results.json ]; then
            node -e "
              const audit = JSON.parse(require('fs').readFileSync('audit-results.json', 'utf8'));
              if (audit.vulnerabilities) {
                const vulns = Object.keys(audit.vulnerabilities).length;
                console.log('**Vulnerabilities Found:** ' + vulns);
                if (vulns > 0) {
                  console.log('**Recommendation:** Review and update dependencies');
                }
              } else {
                console.log('**Status:** ✅ No vulnerabilities found');
              }
            " >> security-summary.md
          else
            echo "**Status:** ✅ No vulnerabilities found" >> security-summary.md
          fi

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-${{ github.sha }}
          path: |
            audit-results.json
            security-summary.md
          retention-days: 30

  # Intelligent PR summary with retry mechanism
  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests, build, integration-tests, security-audit]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Generate comprehensive PR summary
        id: summary
        run: |
          echo "PR_SUMMARY<<EOF" >> $GITHUB_OUTPUT

          echo "## 🚀 PR Validation Results" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT

          # Overall status
          declare -A results=(
            ["code-quality"]="${{ needs.code-quality.result }}"
            ["unit-tests"]="${{ needs.unit-tests.result }}"
            ["build"]="${{ needs.build.result }}"
            ["integration-tests"]="${{ needs.integration-tests.result }}"
            ["security-audit"]="${{ needs.security-audit.result }}"
          )

          passed=0
          total=0
          for result in "${results[@]}"; do
            ((total++))
            if [[ "$result" == "success" ]]; then
              ((passed++))
            fi
          done

          if [[ $passed -eq $total ]]; then
            echo "### ✅ All checks passed! ($passed/$total)" >> $GITHUB_OUTPUT
          else
            echo "### ⚠️ Some checks need attention ($passed/$total)" >> $GITHUB_OUTPUT
          fi

          echo "" >> $GITHUB_OUTPUT
          echo "| Check | Status | Details |" >> $GITHUB_OUTPUT
          echo "|-------|--------|---------|" >> $GITHUB_OUTPUT

          for check in "${!results[@]}"; do
            result="${results[$check]}"
            case $result in
              "success") emoji="✅"; status="Passed" ;;
              "failure") emoji="❌"; status="Failed" ;;
              "cancelled") emoji="🚫"; status="Cancelled" ;;
              "skipped") emoji="⏭️"; status="Skipped" ;;
              *) emoji="❓"; status="Unknown" ;;
            esac
            echo "| ${check//-/ } | $emoji $status | [View Details](#) |" >> $GITHUB_OUTPUT
          done

          echo "" >> $GITHUB_OUTPUT
          echo "### 📊 Coverage Summary" >> $GITHUB_OUTPUT
          echo "${{ needs.unit-tests.outputs.COVERAGE_SUMMARY || 'Coverage data not available' }}" >> $GITHUB_OUTPUT

          echo "" >> $GITHUB_OUTPUT
          echo "### 🔧 Optimizations Applied" >> $GITHUB_OUTPUT
          echo "- ⚡ **Smart Caching**: Dependencies and builds cached for faster execution" >> $GITHUB_OUTPUT
          echo "- 🔄 **Parallel Execution**: Quality checks run simultaneously" >> $GITHUB_OUTPUT
          echo "- 📱 **Multi-Browser Testing**: Comprehensive cross-browser validation" >> $GITHUB_OUTPUT
          echo "- 🛡️ **Enhanced Security**: Detailed vulnerability scanning" >> $GITHUB_OUTPUT
          echo "- 📈 **Intelligent Reporting**: Comprehensive status with actionable insights" >> $GITHUB_OUTPUT

          echo "" >> $GITHUB_OUTPUT
          echo "---" >> $GITHUB_OUTPUT
          echo "*🤖 Generated by optimized GitHub Actions • Commit: \`${{ github.sha }}\`*" >> $GITHUB_OUTPUT

          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post PR comment with retry
        uses: actions/github-script@v7
        with:
          retries: 3
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            const summary = `${{ steps.summary.outputs.PR_SUMMARY }}`;

            if (!summary || summary.trim().length === 0) {
              console.log('❌ No summary content generated, skipping comment');
              return;
            }

            try {
              // Find existing PR validation comment
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              const existingComment = comments.find(comment =>
                comment.body.includes('🚀 PR Validation Results') ||
                comment.body.includes('PR Validation Results')
              );

              const commentParams = {
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary
              };

              if (existingComment) {
                console.log('🔄 Updating existing PR validation comment');
                await github.rest.issues.updateComment({
                  ...commentParams,
                  comment_id: existingComment.id
                });
              } else {
                console.log('✨ Creating new PR validation comment');
                await github.rest.issues.createComment({
                  ...commentParams,
                  issue_number: context.issue.number
                });
              }

              console.log('✅ PR comment posted successfully');

            } catch (error) {
              console.error('❌ Failed to post PR comment:', error.message);

              // Create issue comment as fallback
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: `⚠️ **PR Validation Summary**\n\nUnable to post detailed results due to API limitations.\nCheck the [Actions tab](../../actions) for full results.\n\n*Status: ${{ needs.code-quality.result == 'success' && needs.unit-tests.result == 'success' && needs.build.result == 'success' && needs.integration-tests.result == 'success' && needs.security-audit.result == 'success' && '✅ All checks passed' || '⚠️ Some checks failed' }}*`
                });
                console.log('✅ Fallback comment posted');
              } catch (fallbackError) {
                console.error('❌ Fallback comment also failed:', fallbackError.message);
                // Don't fail the workflow for comment issues
              }
            }
