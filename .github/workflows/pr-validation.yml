name: PR Validation

on:
  pull_request:
    branches: [main]

# Sets permissions for GITHUB_TOKEN
permissions:
  contents: read
  checks: write
  pull-requests: write
  issues: write

# Allow only one concurrent run per PR
concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Lint and Format Check
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check

  # Unit Tests with Coverage
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:unit:ci

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: unit-tests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Build Test
  build:
    name: Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7

  # Integration Tests (Playwright)
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # Security Audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level moderate

  # PR Summary Comment
  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests, build, integration-tests, security-audit]
    if: false # Temporarily disabled due to permissions issue
    steps:
      - name: Create PR Summary Comment
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              'code-quality': '${{ needs.code-quality.result }}',
              'unit-tests': '${{ needs.unit-tests.result }}',
              'build': '${{ needs.build.result }}',
              'integration-tests': '${{ needs.integration-tests.result }}',
              'security-audit': '${{ needs.security-audit.result }}'
            };

            const passed = Object.values(results).filter(r => r === 'success').length;
            const total = Object.keys(results).length;

            const emoji = passed === total ? '✅' : '❌';
            const status = passed === total ? 'All checks passed!' : `${passed}/${total} checks passed`;

            let body = `## ${emoji} PR Validation Results\n\n${status}\n\n`;
            body += '| Check | Status |\n|-------|--------|\n';

            for (const [check, result] of Object.entries(results)) {
              const statusEmoji = result === 'success' ? '✅' : result === 'failure' ? '❌' : '⏸️';
              body += `| ${check.replace('-', ' ')} | ${statusEmoji} ${result} |\n`;
            }

            body += '\n---\n*This comment was generated by the PR validation workflow*';

            // Ensure we have content to post
            if (!body || body.trim().length === 0) {
              console.log('No content to post, skipping comment');
              return;
            }

            try {
              // Find existing comment
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              const existingComment = comments.data.find(
                comment => comment.body.includes('PR Validation Results')
              );

              if (existingComment) {
                // Update existing comment
                console.log('Updating existing PR validation comment');
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body: body
                });
              } else {
                // Create new comment
                console.log('Creating new PR validation comment');
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: body
                });
              }
            } catch (error) {
              console.error('Failed to post PR comment:', error);
              console.log('Comment body that failed to post:', body);
              // Don't fail the workflow if comment posting fails
            }
